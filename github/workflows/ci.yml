name: ECA-PQFA CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Compile
        run: python -m compileall backend scripts run.py
      - name: Test
        run: python -m pytest -q
      - name: Synthetic end-to-end tool run
        run: python -m backend.app demo

  openssl-capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show OpenSSL capability
        run: |
          openssl version
          openssl list -signature-algorithms | grep -i 'ML-DSA' || true

name: Pylint

on:
  push:
    branches: ["main", "fix/research-tool-audit"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pylint
      - name: Compile
        run: python -m compileall backend scripts run.py
      - name: Lint
        run: pylint --errors-only $(git ls-files '*.py')

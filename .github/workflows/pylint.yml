name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Python static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and lint tools
        run: python -m pip install -e ".[dev]"
      - name: Check undefined names and syntax-risk issues
        run: ruff check --select F821,F822,F823 backend scripts run.py tests
